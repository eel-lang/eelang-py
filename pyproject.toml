[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eelang"
version = "0.1.0"
description = "eelang — надмножество Python 3.15: паттерн-матчинг в присваиваниях, match def, пайплайны"
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "MIT"
license-files = ["LICENSE", "csrc/LICENSE.PSF"]
classifiers = [
    "Programming Language :: Python :: 3.15",
    "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
include-package-data = false
packages = ["eelang"]
